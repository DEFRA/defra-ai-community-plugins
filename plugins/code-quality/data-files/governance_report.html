<!doctype html>
<html lang="en" style="zoom: 70%">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate" />
    <title>Code Quality Report (SonarCloud)</title>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"
      integrity="sha512-CQBWl4fJHWbryGE+Pc7UAxWMUMNMWzWxF4SQo9CgkJIN1kx6djDQZjh3Y8SZ1d+6I+1zze6Z7kHXO7q3UyZAWw=="
      crossorigin="anonymous"
    ></script>
    <link
      rel="stylesheet"
      href="https://assets.publishing.service.gov.uk/government-frontend/govuk-frontend-4.7.0.min.css"
    />

    <style>
      :root {
        --bg: #f4f6f8;
        --surface: #ffffff;
        --surface-soft: #f8fafc;
        --border: #d8dde3;
        --border-strong: #b1b4b6;
        --text: #0b0c0c;
        --muted: #505a5f;
        --primary: #1d70b8;
        --primary-dark: #003078;
        --success: #00703c;
        --success-dark: #005a30;
        --warning: #f47738;
        --warning-bg: #fff4e0;
        --danger: #d4351c;
        --danger-bg: #fcebea;
        --shadow-sm: 0 1px 2px rgba(11, 12, 12, 0.06);
        --shadow-md: 0 6px 20px rgba(11, 12, 12, 0.08);
        --shadow-lg: 0 16px 40px rgba(11, 12, 12, 0.12);
        --radius: 14px;
        --radius-sm: 10px;

        /* Shared width so header aligns exactly with the middle pane */
        --page-width: 1800px;
        --page-pad: 24px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        background: linear-gradient(180deg, #f7f9fb 0%, #f3f2f1 100%);
        color: var(--text);
        font-family:
          'Segoe UI',
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        font-size: 16px;
        line-height: 1.5;
      }

      /* =========================================
   HEADER
   ========================================= */
      .defra-header {
        position: sticky;
        top: 0;
        z-index: 1000;
        background: #00703c;
        color: #fff;
        border-bottom: none;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18);
        padding: 0;
      }

      .defra-header__inner {
        max-width: var(--page-width);
        margin: 0 auto;
        display: grid;
        grid-template-columns: 180px 1fr 320px;
        align-items: center;
        gap: 20px;
        padding: 10px var(--page-pad);
        min-height: 80px;
      }

      /* Left block */
      .defra-header__brand-group {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        min-width: 0;
      }

      .defra-header__logo {
        height: 70px;
        width: auto;
        display: block;
        object-fit: contain;
        flex: 0 0 auto;
        filter: brightness(0) invert(1) drop-shadow(0 1px 3px rgba(0, 0, 0, 0.25));
      }

      /* Middle title block */
      .defra-header__title-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        min-width: 0;
      }

      .report-title,
      .defra-header__service-name {
        display: inline-block;
        color: #fff;
        font-family:
          'Segoe UI',
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        font-size: 27px;
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: -0.01em;
        text-decoration: none;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        cursor: pointer;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.25);
      }

      .report-title:hover,
      .defra-header__service-name:hover {
        color: rgba(255, 255, 255, 0.85);
        text-decoration: none;
      }

      /* Right search block */
      .defra-header-search {
        justify-self: end;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        width: 100%;
        max-width: 320px;
        position: relative;
      }

      .defra-header .mode-panel {
        display: flex;
        align-items: center;
        gap: 8px;
        position: relative;
        width: 100%;
      }

      #groupSearch {
        width: 100%;
        height: 40px;
        padding: 8px 12px;
        border: 2px solid #fff;
        border-radius: 4px;
        font-size: 16px;
        font-family:
          'Segoe UI',
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: #fff;
        color: #0b0c0c;
        box-shadow: none;
        transition: border-color 0.15s ease;
      }

      #groupSearch::placeholder {
        color: #6f777b;
      }

      #groupSearch:focus {
        outline: 3px solid #ffdd00;
        outline-offset: 0;
        border-color: #0b0c0c;
        background: #fff;
        box-shadow: none;
        color: #0b0c0c;
      }

      /* Suggestions */
      #groupSuggestions,
      #suggestions {
        position: absolute;
        top: calc(100% + 4px);
        left: 0;
        width: 100%;
        background: #fff;
        border: 2px solid #0b0c0c;
        border-radius: 0;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        z-index: 1000;
        overflow: hidden;
      }

      #groupSuggestions {
        max-height: 360px;
        overflow-y: auto;
      }

      #groupSuggestions div,
      #suggestions div {
        padding: 12px 16px;
        cursor: pointer;
        border-bottom: 1px solid #edf1f4;
        font-size: 17px;
        color: #0b0c0c;
        transition: background 0.12s ease;
      }

      #groupSuggestions div:hover,
      #suggestions div:hover {
        background: #f5f8fb;
      }

      #groupSuggestions div:last-child,
      #suggestions div:last-child {
        border-bottom: none;
      }

      /* =========================================
   MAIN LAYOUT
   ========================================= */
      .wrap {
        max-width: var(--page-width);
        margin: 0 auto;
        padding: 0 var(--page-pad) 24px;
      }

      main {
        margin-top: 24px;
        padding: 28px;
        background: var(--surface);
        min-height: 60vh;
        border: 1px solid #e7eaee;
        border-radius: 24px;
        box-shadow: var(--shadow-md);
      }

      /* =========================================
   TYPOGRAPHY
   ========================================= */
      h1 {
        font-size: 40px;
        font-weight: 700;
        margin: 0 0 10px;
        line-height: 1.1;
        letter-spacing: -0.02em;
      }
      h2 {
        font-size: 32px;
        font-weight: 700;
        margin: 36px 0 14px;
        line-height: 1.15;
        letter-spacing: -0.01em;
      }
      h3 {
        font-size: 26px;
        font-weight: 700;
        margin: 20px 0 12px;
        line-height: 1.25;
      }
      h4 {
        font-size: 22px;
        font-weight: 700;
        margin: 14px 0 8px;
        color: var(--text);
        line-height: 1.25;
      }
      .sub,
      .gr-sub,
      .gm-sub {
        font-size: 18px;
        color: var(--muted);
        line-height: 1.45;
      }

      /* =========================================
   CARDS / SUMMARY TILES
   ========================================= */
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        margin: 0;
      }
      .col4 {
        width: calc(25% - 12px);
        padding: 0;
      }
      .card {
        height: 100%;
        color: var(--text);
        padding: 18px 18px 14px;
        margin-bottom: 0;
        text-align: left;
        border-radius: 18px;
        border: 1px solid var(--border);
        background: #fff;
        box-shadow: var(--shadow-sm);
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease;
      }
      .card:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-md);
      }
      .card .l {
        font-size: 15px;
        font-weight: 700;
        color: var(--muted);
        margin-bottom: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .card .v {
        display: block;
        font-size: 28px;
        font-weight: 700;
        padding: 16px 18px;
        margin-top: 0;
        border-radius: 14px;
        border: none;
      }
      .card.blue {
        background: linear-gradient(180deg, #f8fbff 0%, #f2f8fd 100%);
        border-color: #c9dff1;
      }
      .card.blue .v {
        background: #dfeffc;
        color: var(--primary-dark);
      }
      .card.green {
        background: linear-gradient(180deg, #f7fcf8 0%, #f0f8f2 100%);
        border-color: #cfe7d7;
      }
      .card.green .v {
        background: #d8efdf;
        color: var(--success-dark);
      }
      /* =========================================
   DEFRA-STYLE FOOTER (ALIGNED WITH PANEL)
   ========================================= */
      /* =========================================
   DEFRA-STYLE FOOTER (ALIGNED)
   ========================================= */
      .defra-footer {
        background: #f3f2f1;
        border-top: 8px solid #00703c;
        margin-top: 40px;
        padding: 18px 0 14px;
        font-family:
          'Segoe UI',
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      }

      /* SAME alignment as header + middle panel */
      .defra-footer__inner {
        max-width: var(--page-width);
        margin: 0 auto;
        padding: 0 var(--page-pad);
      }

      .defra-footer__links {
        display: flex;
        flex-wrap: wrap;
        gap: 0;
        font-size: 16px;
        color: #0b0c0c;
      }

      /* Each item styled like DEFRA footer links */
      .footer-item {
        position: relative;
        padding-right: 18px;
        margin-right: 18px;
        font-weight: 400; /* not bold (this was your issue) */
      }

      /* Separator (instead of spaces) */
      .footer-item::after {
        content: '';
        position: absolute;
        right: 0;
        top: 50%;
        width: 6px;
        height: 6px;
        border-top: 2px solid #505a5f;
        border-right: 2px solid #505a5f;
        transform: translateY(-50%) rotate(45deg);
      }

      /* Remove separator from last item */
      .footer-item:last-child {
        margin-right: 0;
        padding-right: 0;
      }

      .footer-item:last-child::after {
        display: none;
      }
      .defra-footer__meta {
        font-size: 14px;
        color: #505a5f;
        line-height: 1.4;
      }
      /* =========================================
   ABOUT / INSET / RECOMMENDATION
   ========================================= */
      .inset {
        padding: 22px 24px;
        margin: 20px 0;
        border-left: 6px solid var(--primary);
        background: linear-gradient(180deg, #f6faff 0%, #f3f7fb 100%);
        border-radius: 16px;
        font-size: 21px !important;
        box-shadow: var(--shadow-sm);
      }
      .inset h3,
      .inset .sub {
        font-size: 24px !important;
        font-weight: 700 !important;
        margin-top: 0 !important;
        margin-bottom: 10px !important;
      }

      .project-details,
      .decluttered-details,
      .details-row,
      .details-col,
      .metrics-row,
      .metric {
        font-size: 21px !important;
        color: #000 !important;
        font-family:
          'Segoe UI',
          -apple-system,
          BlinkMacSystemFont,
          sans-serif !important;
      }

      /* =========================================
   GROUP MODAL (COMPATIBILITY)
   ========================================= */
      #groupModal {
        display: none;
      }

      .gm-wrap {
        max-width: 2000px;
        width: 96%;
        max-height: 95vh;
        overflow-y: auto;
        position: absolute;
        left: 50%;
        top: 4vh;
        transform: translateX(-50%);
        font-family:
          'Segoe UI',
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      }

      .gm-card {
        background: #fff;
        border: 1px solid #0b0c0c;
        border-radius: 0;
        overflow: hidden;
        box-shadow: var(--shadow-lg);
      }

      .gm-close {
        position: absolute;
        top: 12px;
        right: 16px;
        background: #fff;
        border: 1px solid var(--border-strong);
        border-radius: 12px;
        width: 40px;
        height: 40px;
        font-size: 24px;
        line-height: 36px;
        text-align: center;
        cursor: pointer;
        color: #0b0c0c;
        font-weight: 700;
      }
      .gm-close:hover {
        color: #fff;
        background: #0b0c0c;
      }

      .gm-header {
        padding: 16px;
        border-bottom: 0.5px solid #d4d4d0;
      }
      .gm-title {
        font-size: 28px;
        font-weight: 700;
        margin: 0 0 6px;
      }
      .gm-sub {
        font-size: 18px;
        color: #505a5f;
      }
      .gm-body {
        padding: 14px 16px;
      }

      .gm-body table {
        width: 100%;
        border-collapse: collapse;
      }
      .gm-body th,
      .gm-body td {
        padding: 10px 12px 10px 0;
        border-bottom: 1px solid #b1b4b6;
        font-size: 18px;
      }
      .gm-body tbody tr:hover {
        background: #f3f2f1;
        cursor: pointer;
      }

      .gm-pager {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
      }
      .gm-btn {
        border: none;
        background: #00703c;
        color: #fff;
        padding: 8px 16px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        border-radius: 12px;
      }
      .gm-btn:hover {
        background: #005a30;
      }
      .gm-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        background: #b1b4b6;
        border-color: #b1b4b6;
      }
      .gm-page {
        font-size: 16px;
        color: #0b0c0c;
        font-weight: 700;
      }
      .gm-note {
        margin-top: 10px;
        color: #505a5f;
        font-size: 15px;
      }

      /* =========================================
   ENHANCED GROUP MODAL PROJECT CARDS
   ========================================= */
      .gm-project-card {
        background: #fff;
        border: 1px solid #e5e8ec;
        border-radius: 16px;
        margin-bottom: 20px;
        overflow: hidden;
        box-shadow: var(--shadow-sm);
        font-family:
          'Segoe UI',
          -apple-system,
          BlinkMacSystemFont,
          sans-serif !important;
        font-size: 19px !important;
        color: #0b0c0c !important;
      }
      .gm-project-card * {
        font-family:
          'Segoe UI',
          -apple-system,
          BlinkMacSystemFont,
          sans-serif !important;
        font-size: 19px !important;
        color: #0b0c0c !important;
      }
      .gm-project-card:last-child {
        margin-bottom: 0;
      }

      .gm-project-header {
        padding: 14px 18px;
        border-bottom: 1px solid #edf1f4;
        background: #f8fafc;
      }
      .gm-project-name {
        font-size: 22px;
        font-weight: 700;
        color: #0b0c0c;
        margin: 0 0 8px;
      }
      .gm-project-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 18px;
        font-size: 16px;
        color: #0b0c0c;
      }
      .gm-project-meta .lb {
        font-weight: 600;
        color: #505a5f;
      }

      .gm-section-bar {
        padding: 7px 18px;
        background: #eef2f6;
        border-top: 1px solid #dfe4e8;
        border-bottom: 1px solid #dfe4e8;
        font-size: 16px;
        font-weight: 700;
        color: #0b0c0c;
      }

      .gm-summary-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        padding: 12px 18px;
      }
      .gm-summary-item {
        background: #f8fafc;
        border-radius: 12px;
        padding: 12px 14px;
        border: 1px solid #e5e8ec;
      }
      .gm-summary-item .bl {
        font-size: 14px;
        font-weight: 600;
        color: #505a5f;
        display: block;
        margin-bottom: 6px;
      }
      .gm-summary-item .val {
        font-size: 20px;
        font-weight: 700;
        color: #0b0c0c;
      }

      /* Compact stats row */
      .gm-stats-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 10px 18px;
      }
      .gm-stat-chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 15px;
        font-weight: 600;
        background: #f7f9fb;
        border: 1px solid #dfe4e8;
        color: #0b0c0c;
      }
      .gm-stat-chip .sc-label {
        color: #505a5f;
        font-weight: 500;
      }
      .gm-stat-chip .sc-val {
        font-weight: 700;
      }
      .gm-stat-chip.bugs .sc-val {
        color: #d4351c;
      }
      .gm-stat-chip.vulns .sc-val {
        color: #534ab7;
      }
      .gm-stat-chip.smells .sc-val {
        color: #f47738;
      }
      .gm-stat-chip.hotspots .sc-val {
        color: #d4351c;
      }
      .gm-stat-chip.coverage .sc-val {
        color: #00703c;
      }
      .gm-stat-chip.duplication .sc-val {
        color: #f47738;
      }

      /* Aging tags */
      .gm-aging-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 8px 18px 10px;
      }
      .gm-aging-tag {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 600;
        background: #f3f7fb;
        border: 1px solid #1d70b8;
        color: #0b0c0c;
      }
      .gm-aging-tag .at-band {
        color: #505a5f;
        font-weight: 500;
      }
      .gm-aging-tag .at-val {
        font-weight: 700;
        color: #1d70b8;
      }

      /* Simplified group project card */
      .gm-simple-card {
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 18px 20px;
        background: #fff;
        border: 1px solid #e5e8ec;
        border-left: 6px solid #1d70b8;
        border-radius: 16px;
        font-family:
          'Segoe UI',
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        font-size: 20px;
        color: #0b0c0c;
        box-shadow: var(--shadow-sm);
        transition:
          transform 0.12s ease,
          box-shadow 0.12s ease;
        flex-wrap: wrap;
      }
      .gm-simple-card:hover {
        background: #fbfdff;
        transform: translateY(-1px);
        box-shadow: var(--shadow-md);
      }
      .gm-simple-link {
        color: #1d70b8;
        text-decoration: underline;
        text-decoration-thickness: 2px;
        text-underline-offset: 3px;
        cursor: pointer;
        font-size: 22px;
        font-weight: 700;
        font-family:
          'Segoe UI',
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        min-width: 260px;
        flex: 1 1 auto;
      }
      .gm-simple-link:hover {
        color: #003078;
        text-decoration-thickness: 3px;
      }
      .gm-simple-field {
        font-size: 18px;
        color: #0b0c0c;
        white-space: nowrap;
      }
      .gm-simple-lbl {
        font-weight: 700;
        color: #505a5f;
      }

      /* Tag */
      .tag {
        display: inline-block;
        padding: 5px 10px;
        font-size: 14px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #fff;
        background: #1d70b8;
        margin-right: 8px;
        border-radius: 999px;
      }

      /* =========================================
   TABLES
   ========================================= */
      table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        margin-bottom: 24px;
        font-size: 18px;
        background: #fff;
        border: 1px solid #e5e8ec;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: var(--shadow-sm);
      }
      thead {
        background: #f7f9fb;
      }
      th {
        font-weight: 700;
        text-align: left;
        padding: 14px 18px;
        color: #505a5f;
        border-bottom: 1px solid #e2e7eb;
        font-size: 15px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      tr {
        border-bottom: 1px solid #edf1f4;
      }
      td {
        padding: 14px 18px;
        vertical-align: top;
        font-size: 17px;
        color: #0b0c0c;
      }
      tbody tr:hover {
        background: #f8fbfd;
      }

      /* =========================================
   WARN / OK PANELS
   ========================================= */
      .warn {
        padding: 16px 20px 16px 68px;
        position: relative;
        font-weight: 700;
        margin-bottom: 20px;
        background: #fff4e0;
        border-left: 6px solid #f47738;
        color: #594300;
        border-radius: 14px;
        box-shadow: var(--shadow-sm);
      }
      .warn::before {
        content: '!';
        position: absolute;
        left: 20px;
        top: 10px;
        font-size: 34px;
        font-weight: 700;
        color: #f47738;
      }

      .ok {
        margin-bottom: 30px;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid #d6e8dd;
        box-shadow: var(--shadow-sm);
      }
      .ok .oh {
        padding: 14px 18px;
        background: #00703c;
        color: #fff;
        font-weight: 700;
        font-size: 18px;
        border-radius: 0;
      }
      .ok .ob {
        padding: 20px;
        background: #f6fbf7;
        font-size: 22px;
        font-weight: 700;
        color: #00703c;
      }

      /* Search box panel */
      .search-panel {
        background: #f8fafc;
        border: 1px solid var(--border);
        padding: 18px 20px;
        margin-bottom: 30px;
        border-radius: 16px;
      }
      .search-panel input {
        font-size: 18px;
        padding: 12px 14px;
        width: 100%;
        max-width: 820px;
        border: 1px solid var(--border-strong);
        border-radius: 12px;
      }
      .search-panel input:focus {
        outline: 3px solid #ffdd00;
        outline-offset: 0;
        border-color: #1d70b8;
      }

      /* =========================================
   TOOLTIPS
   ========================================= */
      .tooltip {
        position: relative;
        display: inline-block;
        cursor: help;
      }
      .tooltip .tt {
        visibility: hidden;
        width: 360px;
        background: #111827;
        color: #fff;
        text-align: left;
        border: none;
        padding: 14px 16px;
        position: absolute;
        z-index: 1000;
        bottom: 32px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 15px;
        line-height: 1.45;
        border-radius: 12px;
        box-shadow: var(--shadow-lg);
      }
      .tooltip:hover .tt {
        visibility: visible;
      }

      /* =========================================
   AI SECTIONS
   ========================================= */
      .ai-rec {
        padding: 22px 24px;
        margin: 16px 0 24px;
        border-left: 6px solid #1d70b8;
        background: linear-gradient(180deg, #f7fbff 0%, #eef5fc 100%);
        position: relative;
        font-size: 22px;
        line-height: 1.6;
        color: #0b0c0c;
        border-radius: 16px;
        box-shadow: var(--shadow-sm);
        font-family:
          'Segoe UI',
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      }
      .ai-rec h3 {
        font-size: 24px;
        font-family:
          'Segoe UI',
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        font-weight: 700;
        margin-top: 0;
        margin-bottom: 14px;
        color: #1d70b8;
      }

      .ai-toggle-wrap {
        margin: 16px 0 26px;
        border-left: 6px solid #1d70b8;
        background: linear-gradient(180deg, #f7fbff 0%, #eef5fc 100%);
        border-radius: 18px;
        box-shadow: var(--shadow-sm);
        font-family:
          'Segoe UI',
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        position: relative;
        overflow: hidden;
      }
      .ai-toggle-wrap::before {
        content: 'AI';
        position: absolute;
        left: 18px;
        top: 18px;
        background: #1d70b8;
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        padding: 5px 8px;
        border-radius: 999px;
        letter-spacing: 0.05em;
      }
      .ai-toggle-btn {
        display: block;
        width: 100%;
        text-align: left;
        padding: 22px 24px 22px 64px;
        background: none;
        border: none;
        cursor: pointer;
        font-size: 24px;
        font-weight: 700;
        color: #1d70b8;
        font-family:
          'Segoe UI',
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        transition: background 0.12s ease;
      }
      .ai-toggle-btn:hover {
        background: rgba(29, 112, 184, 0.04);
      }
      .ai-toggle-body {
        display: none;
        padding: 0 24px 22px 64px;
        font-size: 22px;
        line-height: 1.6;
        color: #0b0c0c;
      }
      .ai-toggle-wrap.expanded .ai-toggle-body {
        display: block;
      }
      .ai-toggle-body h3 {
        font-size: 23px;
        font-weight: 700;
        margin: 16px 0 8px;
      }
      .ai-toggle-body p {
        margin-left: 18px;
      }
      .ai-toggle-body ul {
        margin: 4px 0 10px 34px;
        padding: 0;
      }
      .ai-toggle-body li {
        margin-bottom: 6px;
        font-size: 21px;
      }
      .ai-toggle-body .sub-item {
        margin-left: 34px;
        font-size: 20px;
      }

      .toggle-btn {
        cursor: pointer;
        background: #00703c;
        color: #fff;
        border: none;
        padding: 11px 18px;
        position: relative;
        font-size: 15px;
        font-weight: 700;
        margin-top: 10px;
        border-radius: 12px;
        box-shadow: var(--shadow-sm);
        transition:
          transform 0.12s ease,
          background 0.12s ease,
          box-shadow 0.12s ease;
      }
      .toggle-btn:hover {
        background: #005a30;
        transform: translateY(-1px);
        box-shadow: var(--shadow-md);
      }
      .toggle-btn .arrow {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 12px;
        transition: transform 0.15s;
      }

      /* =========================================
   BREADCRUMB
   ========================================= */
      .govuk-breadcrumbs {
        padding: 8px 0 20px;
        font-size: 16px;
        border-bottom: none;
        margin-bottom: 10px;
      }
      .govuk-breadcrumbs__list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        gap: 0;
        flex-wrap: wrap;
      }
      .govuk-breadcrumbs__list-item {
        display: flex;
        align-items: center;
        color: #505a5f;
      }
      .govuk-breadcrumbs__list-item::before {
        content: '';
        display: inline-block;
        width: 7px;
        height: 7px;
        border-right: 2px solid #505a5f;
        border-top: 2px solid #505a5f;
        transform: rotate(45deg);
        margin: 0 10px;
      }
      .govuk-breadcrumbs__list-item:first-child::before {
        display: none;
      }
      .govuk-breadcrumbs__link {
        color: #1d70b8;
        text-decoration: underline;
        cursor: pointer;
        font-size: 16px;
        background: none;
        border: none;
        padding: 0;
        font-family: inherit;
      }
      .govuk-breadcrumbs__link:hover {
        color: #003078;
        text-decoration-thickness: 3px;
      }

      /* =========================================
   GROUP RESULTS PAGE
   ========================================= */
      #groupResultsPage {
        display: none;
        min-height: calc(100vh - 200px);
      }
      #groupResultsPage.visible {
        display: block;
      }

      .gr-title {
        font-size: 34px;
        font-weight: 700;
        margin: 0 0 6px;
        color: #0b0c0c;
      }
      .gr-sub {
        font-size: 18px;
        color: #505a5f;
        margin-bottom: 20px;
      }

      .gr-list {
        list-style: none;
        padding: 0;
        margin: 0 0 20px;
      }
      .gr-list li {
        margin-bottom: 12px;
      }
      .gr-list li:last-child {
        margin-bottom: 0;
      }

      /* Ensure project cards in group results use same font sizing */
      #groupResultsPage,
      #groupResultsPage .gm-project-card {
        font-family:
          'Segoe UI',
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        font-size: 21px;
        color: #0b0c0c;
      }
      #groupResultsPage .gm-project-card {
        margin-bottom: 20px;
        display: flex;
        flex-direction: column;
      }

      /* Clickable project name link */
      .gm-project-link {
        color: #1d70b8;
        text-decoration: underline;
        cursor: pointer;
        font-size: 22px;
        font-weight: 700;
        font-family:
          'Segoe UI',
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      }
      .gm-project-link:hover {
        color: #003078;
        text-decoration-thickness: 3px;
      }

      /* Grouped header row for project summary */
      .grouped-header {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 32px;
        width: 100%;
        justify-content: flex-start;
      }
      .grouped-header .header-col {
        min-width: 180px;
        flex: 0 0 auto;
        font-size: 1em;
      }
      .grouped-header .project-name {
        min-width: 220px;
        flex: 1 1 0;
        font-size: 1.1em;
      }
      .grouped-header .last-analysis {
        min-width: 180px;
        flex: 0 0 auto;
        font-size: 1em;
        color: #505a5f;
      }

      .gr-pager {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 22px;
      }
      .gr-pager-btn {
        min-width: 80px;
        padding: 11px 18px;
        font-size: 15px;
        font-weight: 700;
        border: none;
        background: #00703c;
        color: #fff;
        cursor: pointer;
        font-family: inherit;
        border-radius: 12px;
        box-shadow: var(--shadow-sm);
      }
      .gr-pager-btn:hover {
        background: #005a30;
      }
      .gr-pager-btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
        background: #b1b4b6;
        border-color: #b1b4b6;
      }
      .gr-pager-info {
        font-size: 16px;
        font-weight: 700;
        color: #0b0c0c;
      }

      /* hero adjustments so logo aligns to top of middle pane */
      .defra-hero {
        display: none;
      }

      /* =========================================
   MODAL
   ========================================= */
      #projectModal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(11, 12, 12, 0.55);
        z-index: 9999;
        justify-content: center;
        align-items: center;
        font-size: 22px;
        backdrop-filter: blur(3px);
      }
      #projectModal.visible {
        display: flex;
      }

      /* Group modal */
      /* Modal wrap sizes to content with no scroll */
      .np-wrap {
        max-width: 2000px;
        width: 96%;
        position: absolute;
        left: 50%;
        top: 1vh;
        transform: translateX(-50%);
        font-family:
          'Segoe UI',
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      }

      .np-card {
        background: #fff;
        border: 1px solid #e5e8ec;
        border-left: 6px solid #1d70b8;
        border-radius: 16px;
        overflow: visible;
        box-shadow: var(--shadow-sm);
        font-size: 19px;
        color: #0b0c0c;
        font-family:
          'Segoe UI',
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      }

      /* 2-column card grid for project detail modal */
      .np-grid-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin: 10px 0;
      }
      .np-grid-card {
        background: #fff;
        border: 1px solid #e5e8ec;
        border-radius: 16px;
        padding: 18px 20px;
        box-shadow: var(--shadow-sm);
      }
      .np-grid-card h4 {
        margin: 0 0 10px 0;
        padding-left: 12px;
        border-left: 4px solid #1d70b8;
        font-size: 22px;
        font-weight: 700;
        color: #0b0c0c;
      }
      .np-grid-card p {
        margin: 8px 0 8px 22px;
        line-height: 1.6;
        font-size: 20px;
      }

      /* Severity table */
      .sev-table {
        width: 100%;
        border-collapse: collapse;
        margin: 10px 0 0 22px;
        font-size: 18px;
        background: transparent;
        border: none;
        box-shadow: none;
      }
      .sev-table td {
        padding: 6px 8px;
        text-align: center;
        font-weight: 700;
        border: none;
        font-size: 18px;
      }
      .sev-table td:first-child {
        text-align: left;
        padding-left: 0;
        font-weight: 500;
      }
      .sev-table .sev-header {
        font-size: 14px;
        font-weight: 700;
        color: #505a5f;
        padding-bottom: 8px;
        border-bottom: 1px solid #e4e7ea;
      }

      /* Severity chips */
      .sev-chip {
        display: inline-block;
        min-width: 32px;
        text-align: center;
        padding: 4px 8px;
        border-radius: 10px;
        font-weight: 700;
        font-size: 16px;
      }
      .sev-chip.s-red {
        background: #fde2df;
        color: #d4351c;
        border: 1px solid #f1b7b0;
      }
      .sev-chip.s-amber {
        background: #fff1df;
        color: #b75b00;
        border: 1px solid #f2cd97;
      }
      .sev-chip.s-grey {
        color: #505a5f;
        background: #f3f4f6;
        border: 1px solid #d7dbe0;
      }

      .np-close {
        position: absolute;
        top: 4px;
        right: 8px;
        background: #fff;
        border: 1px solid var(--border-strong);
        border-radius: 10px;
        width: 34px;
        height: 34px;
        font-size: 20px;
        line-height: 32px;
        text-align: center;
        cursor: pointer;
        color: #0b0c0c;
        font-weight: 700;
        z-index: 10;
        box-shadow: var(--shadow-sm);
      }
      .np-close:hover {
        color: #fff;
        background: #0b0c0c;
      }

      .np-header {
        padding: 6px 22px 6px 16px;
        border-bottom: none;
        cursor: move;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        background: #f8fafc;
        border-radius: 16px 16px 0 0;
        min-height: 0;
      }
      .np-name {
        font-size: 28px;
        font-weight: 700;
        margin: 0;
        color: #0b0c0c;
        flex: 1 1 auto;
      }
      .np-hdr-qg {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 0 0 auto;
        font-size: 17px;
        font-weight: 600;
        color: #505a5f;
      }
      .np-hdr-qg .qg-name {
        padding: 8px 14px;
        background: #f6f8fa;
        border: 1px solid #e5e8ec;
        border-radius: 12px;
        color: #0b0c0c;
        font-size: 16px;
        font-weight: 600;
      }
      .np-hdr-qg .qg-pill {
        padding: 8px 14px;
        border-radius: 999px;
        font-size: 15px;
        font-weight: 700;
      }
      .np-hdr-qg .qg-pill.pass {
        background: #dff1e4;
        color: #005a30;
      }
      .np-hdr-qg .qg-pill.fail {
        background: #fde2df;
        color: #8f1d13;
      }
      .np-hdr-qg .qg-pill.unknown {
        background: #f3f4f6;
        color: #505a5f;
        border: 1px solid #e5e8ec;
      }

      /* card body fills remaining flex space; vh values ÷0.6 to compensate for zoom:60% on html */
      .np-card-body {
        overflow: visible;
      }

      .np-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        font-size: 19px;
        font-weight: 600;
        color: #0b0c0c;
      }

      .np-meta .lb {
        font-size: 16px !important;
        font-weight: 600 !important;
        color: #505a5f !important;
      }

      .np-sbar {
        padding: 10px 18px;
        background: #f7fbff;
        border-top: 1px solid #e5e8ec;
        border-bottom: 1px solid #e5e8ec;
        font-size: 19px;
        font-weight: 700;
        color: #0b0c0c;
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }
      .np-chart-area {
        padding: 16px 18px;
      }

      .np-legend {
        display: flex;
        gap: 14px;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }
      .np-legend-item {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 18px;
        color: #0b0c0c;
      }
      .np-legend-dot {
        display: inline-block;
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }

      .np-chart-wrap {
        position: relative;
        height: 290px;
        background: #fff;
        border: 1px solid #edf1f4;
        border-radius: 16px;
        padding: 10px;
      }
      .np-isec {
        padding: 14px 16px;
      }

      /* Modal metric grid */
      .np-mg {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 10px;
      }
      .np-mi {
        background: #f8fafc;
        border-radius: 14px;
        padding: 14px 16px;
        font-size: 16px;
        color: #0b0c0c;
        border: 1px solid #e5e8ec;
      }

      /* Severity row layout */
      .sev-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 2px 0;
      }
      .sev-label {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family:
          'Segoe UI',
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        font-size: 18px;
        font-weight: 400;
        color: #222;
      }
      .sev-value {
        flex: 0 0 60px;
        margin-left: 8px;
        text-align: right;
        font-family:
          'Segoe UI',
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        font-size: 22px;
        font-weight: 700;
      }

      /* Metric labels */
      .np-ml {
        font-size: 13px;
        color: #44515c;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 6px;
      }
      .np-ml.nc {
        color: #185fa5;
      }

      .np-mv {
        font-size: 19px;
        font-weight: 700;
        color: #0b0c0c;
      }

      .np-rt {
        display: inline-flex;
        padding: 5px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        margin-top: 8px;
        background: #f3f4f6;
      }

      .np-qg {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        margin-left: 8px;
        font-weight: 700;
      }
      .np-qg.pass {
        background: #dff1e4;
        color: #005a30;
      }
      .np-qg.fail {
        background: #fde2df;
        color: #8f1d13;
      }
      .np-qg.unknown {
        background: #f3f4f6;
        color: #505a5f;
        border: 1px solid #e5e8ec;
      }

      .np-bgrid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        padding: 14px 16px;
      }
      .np-bi {
        background: #f8fafc;
        border-radius: 14px;
        padding: 14px;
        font-size: 16px;
        font-weight: 700;
        color: #0b0c0c;
        border: 1px solid #e5e8ec;
      }

      .np-bi .bl {
        font-size: 18px;
        font-weight: 600;
        color: #222;
        margin-bottom: 8px;
        display: block;
      }

      .np-msec {
        padding: 12px 16px;
      }

      /* Search mode buttons */
      .search-mode {
        display: inline-flex;
        border: 1px solid #d9dde2;
        border-radius: 12px;
        overflow: hidden;
        margin: 10px 0 15px;
        background: #fff;
      }
      .mode-btn {
        padding: 10px 20px;
        border: 0;
        background: #fff;
        color: #0b0c0c;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
        border-right: 1px solid #d9dde2;
      }
      .mode-btn:last-child {
        border-right: 0;
      }
      .mode-btn:hover {
        background: #f3f2f1;
      }
      .mode-btn.is-active {
        background: #1d70b8;
        color: #fff;
      }
      .mode-panel input[type='search'] {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border-strong);
        border-radius: 12px;
        outline: none;
      }
      .mode-panel input[type='search']:focus {
        outline: 3px solid #ffdd00;
        outline-offset: 0;
        border-color: #1d70b8;
      }

      /* =========================================
   GROUP MODAL (NEW) / DECLUTTERED CARDS
   ========================================= */
      .gm-project-card.decluttered {
        font-family:
          'Segoe UI',
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        font-size: 16px;
        color: #0b0c0c;
        background: #fff;
        border: 1px solid #e5e8ec;
        border-left: 6px solid #1d70b8;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: var(--shadow-sm);
        margin-bottom: 24px;
        width: 100%;
      }

      .gm-pc-title-bar {
        background: #f7f9fb;
        padding: 12px 18px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 16px;
        border-bottom: 1px solid #e5e8ec;
      }
      .gm-pc-title-bar a.gm-project-link {
        font-size: 24px;
        font-weight: 700;
        color: #1d70b8;
        text-decoration: underline;
        cursor: pointer;
        letter-spacing: 0;
      }
      .gm-pc-title-bar a.gm-project-link:hover {
        color: #003078;
        text-decoration-thickness: 3px;
      }
      .gm-pc-badge {
        display: inline-block;
        font-size: 12px;
        font-weight: 700;
        color: #062a45;
        background: #dfeffc;
        border: 1px solid #b9d5ef;
        border-radius: 999px;
        padding: 2px 8px;
        letter-spacing: 0.02em;
      }
      .gm-pc-badge.plat-cloud {
        color: #05331f;
        background: #d8efdf;
        border-color: #9fd0b4;
      }

      .gm-pc-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 24px;
        padding: 7px 18px;
        background: #fff;
        border-bottom: 1px solid #e5e8ec;
        font-size: 16px;
        color: #505a5f;
      }
      .gm-pc-meta .lb {
        font-weight: 700;
        color: #0b0c0c;
      }

      .gm-pc-row {
        display: flex;
        align-items: stretch;
        border-top: 1px solid #e5e8ec;
      }
      .gm-pc-row-lbl {
        flex: 0 0 130px;
        width: 130px;
        min-width: 130px;
        max-width: 130px;
        padding: 10px 14px;
        background: #f7f9fb;
        border-right: 1px solid #e5e8ec;
        font-size: 13px;
        font-weight: 700;
        color: #505a5f;
        display: flex;
        align-items: center;
        line-height: 1.3;
      }
      .gm-pc-row-body {
        flex: 1 1 0;
        display: flex;
        flex-wrap: nowrap;
        gap: 0;
      }
      .gm-pc-metric {
        flex: 1 1 0;
        padding: 10px 14px;
        border-right: 1px solid #e5e8ec;
        display: flex;
        flex-direction: column;
        gap: 2px;
        background: #fff;
      }
      .gm-pc-metric:last-child {
        border-right: none;
      }
      .gm-pc-metric .m-lbl {
        font-size: 14px;
        font-weight: 600;
        color: #505a5f;
        letter-spacing: 0.02em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .gm-pc-metric .m-val {
        font-size: 20px;
        font-weight: 700;
        color: #0b0c0c;
        line-height: 1.1;
      }
      .gm-pc-metric .m-val.warn-val {
        color: #d4351c;
      }

      .gm-pc-aging-chips {
        flex: 1 1 0;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 10px 14px;
        align-items: flex-start;
        align-content: flex-start;
        background: #fff;
      }
      .gm-pc-aging-chip {
        display: inline-flex;
        flex-direction: column;
        background: #f3f7fb;
        border: 1px solid #1d70b8;
        border-radius: 12px;
        padding: 6px 12px;
        font-size: 14px;
        line-height: 1.5;
        gap: 2px;
      }
      .gm-pc-aging-chip .ac-period {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #505a5f;
        margin-bottom: 2px;
      }
      .gm-pc-aging-chip .ac-bugs {
        color: #d4351c;
        font-weight: 700;
      }
      .gm-pc-aging-chip .ac-smells {
        color: #c17700;
        font-weight: 700;
      }
      .gm-pc-aging-chip .ac-vulns {
        color: #1d70b8;
        font-weight: 700;
      }

      .gm-pc-qgfail {
        padding: 10px 18px;
        border-top: 1px solid #e5e8ec;
        background: #fdf6d8;
        font-size: 16px;
        color: #594300;
        font-weight: 700;
      }
      .gm-pc-qgfail strong {
        font-weight: 700;
      }

      .phase {
        display: none;
      }

      /* =========================================
   RESPONSIVE
   ========================================= */
      @media (max-width: 1280px) {
        .col4 {
          width: calc(50% - 8px);
        }

        .defra-header__inner {
          grid-template-columns: 160px 1fr 260px;
          padding: 10px var(--page-pad);
        }

        .defra-header__logo {
          height: 44px;
        }

        .report-title,
        .defra-header__service-name {
          font-size: 23px;
        }

        .defra-header-search {
          max-width: 260px;
        }
      }

      @media (max-width: 900px) {
        body {
          font-size: 17px;
        }
        main {
          padding: 20px;
        }
        h1 {
          font-size: 36px;
        }
        h2 {
          font-size: 28px;
        }
        .defra-header__inner {
          grid-template-columns: 1fr;
          gap: 10px;
          text-align: center;
          min-height: auto;
          padding: 10px var(--page-pad);
        }

        .defra-header__brand-group {
          justify-content: center;
        }

        .defra-header__title-wrap {
          justify-content: center;
        }

        .defra-header-search {
          justify-self: center;
          max-width: 520px;
          width: 100%;
        }

        .defra-header__logo {
          height: 38px;
        }

        .report-title,
        .defra-header__service-name {
          font-size: 21px;
          white-space: normal;
        }

        .np-grid-row {
          grid-template-columns: 1fr;
        }
        .gm-simple-card {
          flex-direction: column;
          align-items: flex-start;
        }
        .gm-simple-field {
          white-space: normal;
        }
      }

      @media (max-width: 640px) {
        .col4 {
          width: 100%;
        }

        .wrap {
          padding: 0 12px 18px;
        }

        main {
          border-radius: 18px;
          padding: 16px;
        }

        .defra-header__inner {
          padding: 8px 12px;
        }

        .defra-header__logo {
          height: 34px;
        }

        .report-title,
        .defra-header__service-name {
          font-size: 19px;
        }

        #groupSearch {
          height: 36px;
          font-size: 16px;
        }

        table {
          display: block;
          overflow-x: auto;
          white-space: nowrap;
        }

        td {
          font-size: 18px;
        }

        .ai-toggle-btn,
        .ai-toggle-body,
        .ai-rec,
        .inset {
          font-size: 20px !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="defra-header" role="banner">
      <div class="defra-header__inner">
        <div class="defra-header__brand-group">
          <img
            src="https://digital.defra.gov.uk/public/images/defra-logo.svg"
            alt=""
            role="presentation"
            class="defra-header__logo"
          />
        </div>

        <div class="defra-header__title-wrap" style="flex-direction: column; gap: 4px">
          <a href="#" id="headerHomeLink" class="report-title">
            Code Quality Report (SonarCloud)
          </a>
        </div>

        <div class="defra-header-search">
          <div id="panel-group" class="mode-panel">
            <input
              id="groupSearch"
              type="search"
              autocomplete="off"
              placeholder="Search for project..."
              title="Search for project groups to view detailed metrics"
              aria-label="Search for project groups to view detailed metrics"
            />

          </div>
        </div>

    </header>

    <div class="wrap">
      <main>
        <!-- HOME VIEW -->
        <div id="homeView">
          <nav class="govuk-breadcrumbs" aria-label="Breadcrumb">
            <ol class="govuk-breadcrumbs__list">
              <li class="govuk-breadcrumbs__list-item" aria-current="page">SonarCloud Home</li>
            </ol>
          </nav>

          <!-- Visible search moved into header. Keep hidden single-project search for modal functionality. -->
          <!-- Hidden single-project search (kept for projectModal to work) -->
          <div id="panel-project" style="display: none">
            <input
              id="projectSearch"
              type="search"
              autocomplete="off"
              aria-label="Search for a project"
            />
            <div id="suggestions"></div>
          </div>

          <div id="exec"></div>
          <div id="issueChart" style="margin-top: 30px"></div>
          <div id="aiNarrative"></div>
          <div id="s1"></div>
          <div id="s2"></div>
          <div id="s3"></div>
          <div id="s4"></div>
          <div id="s5"></div>
          <div id="s6"></div>
          <div id="s7"></div>
          <div id="s8"></div>
          <div id="s9"></div>
          <div id="s10"></div>
          <div id="s11"></div>
        </div>
        <!-- /homeView -->

        <!-- GROUP RESULTS VIEW: shown in-page when a group is selected -->
        <div id="groupResultsPage">
          <nav class="govuk-breadcrumbs" aria-label="Breadcrumb">
            <ol class="govuk-breadcrumbs__list">
              <li class="govuk-breadcrumbs__list-item">
                <button class="govuk-breadcrumbs__link" id="breadcrumbHome">SonarCloud Home</button>
              </li>
              <li class="govuk-breadcrumbs__list-item" aria-current="page" id="breadcrumbGroup">
                Group results
              </li>
            </ol>
          </nav>
          <h1 class="gr-title" id="grTitle" aria-live="polite">Group details</h1>
          <p class="gr-sub" id="grSub"></p>

          <div id="groupAiSummary"></div>
          <ul class="gr-list" id="grList"></ul>
          <div class="gr-pager">
            <button type="button" class="gr-pager-btn" id="grPrev">&laquo; Previous</button>
            <span class="gr-pager-info" id="grPageInfo"></span>
            <button type="button" class="gr-pager-btn" id="grNext">Next &raquo;</button>
          </div>
        </div>
        <!-- /groupResultsPage -->
      </main>
    </div>
    <footer class="defra-footer" role="contentinfo">
      <div class="defra-footer__inner">
        <div class="defra-footer__links">
          <span class="footer-item">Privacy</span>
          <span class="footer-item">Cookies</span>
          <span class="footer-item">Accessibility statement</span>
        </div>

        <div class="defra-footer__meta">
          Maintained by Cross Cutting Technical Services - Quality Assurance & Test.
        </div>
      </div>
    </footer>

    <!-- Modal -->
    <div id="projectModal">
      <div class="np-wrap">
        <button class="np-close" id="closeModal">&times;</button>
        <div class="np-card">
          <div class="np-header" title="Drag to move"></div>
          <div class="np-card-body">
            <div class="np-sbar">
              <div
                id="pcName"
                class="np-name"
                style="font-size: 21px; font-weight: 700; flex: 1 1 auto; margin: 0; color: #0b0c0c"
              ></div>
              <div class="np-hdr-qg">
                <span id="pcQgName" class="qg-name"></span
                ><span id="pcQgPill" class="qg-pill"></span>
              </div>
            </div>
            <div class="np-chart-area">
              <div
                style="
                  font-size: 13px;
                  font-weight: 700;
                  color: #1d70b8;
                  margin-bottom: 4px;
                  text-align: center;
                  letter-spacing: 0.01em;
                "
              >
                Issue Aging Distribution — Overall Code: Open Issues Across Years
              </div>
              <div class="np-legend" id="pcLegend"></div>
              <div class="np-chart-wrap"><canvas id="pcAgingCanvas"></canvas></div>
            </div>
            <div
              id="pcStructured"
              style="
                padding: 16px 18px;
                font-family:
                  'Segoe UI',
                  -apple-system,
                  BlinkMacSystemFont,
                  sans-serif;
                font-size: 19px;
                color: #0b0c0c;
                line-height: 1.55;
              "
            ></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      ;(function () {
        var DATA, AGING
        var GROUP_MAP = {}
        Promise.all([
          fetch('sonar_repo_metrics.json', { cache: 'no-store' }).then((r) => r.json()),
          fetch('sonar_aging_merged.json', { cache: 'no-store' })
            .then((r) => r.json())
            .catch(() => []),
          fetch('project_group_map.json', { cache: 'no-store' })
            .then((r) => r.json())
            .catch(() => ({}))
        ]).then(function (res) {
          DATA = res[0]
          AGING = res[1]
          GROUP_MAP = res[2] || {}
          renderAll()
          initSearch()
          initGroupSearch()
          initNavigation()
        })

        /* helpers */
        function $(id) {
          return document.getElementById(id)
        }
        function esc(s) {
          return s == null
            ? ''
            : String(s).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
        }
        function num(x) {
          if (x == null) return 0
          if (typeof x === 'number') return x
          return Number.parseFloat(x) || 0
        }
        function fmt(x) {
          return x == null ? '\u2014' : String(x)
        }
        function commas(n) {
          return n == null ? '0' : Number(n).toLocaleString()
        }

        /* Return the recorded last analysis date or compute a fallback from days since last analysis */
        function getLastAnalysis(r) {
          try {
            if (r == null) return ''
            if (r.last_analysis_date != null && String(r.last_analysis_date).trim() !== '')
              return String(r.last_analysis_date).slice(0, 10)
            if (r['Last Scan Date'] != null && String(r['Last Scan Date']).trim() !== '')
              return String(r['Last Scan Date']).slice(0, 10)
            var d =
              r.days_since_last_analysis != null
                ? r.days_since_last_analysis
                : r['Days Since Last Scan']
            if (d == null || d === '') return ''
            var days = Number(d)
            if (Number.isNaN(days)) return ''
            var dt = new Date()
            dt.setDate(dt.getDate() - days)
            return dt.toISOString().slice(0, 10)
          } catch (e) {
            console.warn('getLastAnalysis failed:', e)
            return ''
          }
        }

        function metricCard(label, value, colorClass) {
          return (
            '<div class="col4"><div class="card ' +
            colorClass +
            '"><div class="l">' +
            esc(label) +
            '</div><div class="v">' +
            esc(String(value)) +
            '</div></div></div>'
          )
        }

        function renderTable(headers, rows, rowRenderer) {
          if (!rows || !rows.length)
            return '<div class="ok"><div class="oh">Success</div><div class="ob">No issues found</div></div>'
          var html = '<table><thead><tr>'
          headers.forEach(function (header) {
            html += '<th>' + esc(header) + '</th>'
          })
          html += '</tr></thead><tbody>'
          rows.forEach(function (row, i) {
            html +=
              '<tr' +
              (i >= 3 ? ' style="display:none" data-extra' : '') +
              '>' +
              rowRenderer(row) +
              '</tr>'
          })
          html += '</tbody></table>'
          if (rows.length > 3)
            html +=
              '<button class="toggle-btn" onclick="toggleRows(this)"><span class="arrow">\u25B6</span><span>Show ' +
              (rows.length - 3) +
              ' more (' +
              rows.length +
              ' total)</span></button>'
          return html
        }
        function cell(value) {
          return '<td>' + esc(value == null ? '' : String(value)) + '</td>'
        }

        function aiInsightBlock(sectionKey) {
          if (!DATA.ai_insights || !DATA.ai_insights.sections) return ''
          var sections = DATA.ai_insights.sections
          var insightText = sections[sectionKey + '_insights'] || ''
          var actionText = sections[sectionKey + '_action'] || ''
          if (!insightText && !actionText) return ''
          var html = '<div class="ai-rec">'
          if (insightText) html += '<strong>Insights:</strong> ' + esc(insightText)
          if (actionText)
            html += (insightText ? '<br>' : '') + '<strong>Action:</strong> ' + esc(actionText)
          html += '</div>'
          return html
        }

        function renderSection(
          sectionNumber,
          title,
          tooltip,
          headers,
          rows,
          rowRenderer,
          aiSectionKey
        ) {
          var html =
            '<h2>' +
            sectionNumber +
            '. ' +
            esc(title) +
            ' <span class="tooltip">\u2139\uFE0F<span class="tt">' +
            tooltip +
            '</span></span></h2>'
          if (rows && rows.length) {
            html += renderTable(headers, rows, rowRenderer)
            html += aiInsightBlock(aiSectionKey)
          } else {
            html +=
              '<div class="ok"><div class="oh">Success</div><div class="ob">No issues found in this category</div></div>'
          }
          return html
        }

        /* ---- RENDER ---- */
        /* Resolve a platform-specific stat: use the platform's own value when present,
   otherwise fall back to the page total (when that platform is the active filter)
   or a portfolio-level fallback. */
        function resolvePlatformStat(platformValue, isActivePlatform, activeTotal, fallback) {
          if (platformValue != null) return platformValue
          return isActivePlatform ? activeTotal : fallback || 0
        }

        function buildPlatformStatsBlock(heading, colorClass, labels, repos, loc, priv, pub) {
          var html = '<h3>' + heading + '</h3><div class="row">'
          html += metricCard(labels[0], commas(repos), colorClass)
          html += metricCard(labels[1], commas(loc), colorClass)
          html += metricCard(labels[2], commas(priv), colorClass)
          html += metricCard(labels[3], commas(pub), colorClass)
          html += '</div>'
          return html
        }

        function buildSonarStatsHtml() {
          var portfolio = DATA.portfolio || {}
          var platformMetrics = DATA.platform_metrics || {},
            sonarQube = platformMetrics.sonarqube || {},
            sonarCloud = platformMetrics.sonarcloud || {}
          var platformFilter = DATA.platform_filter /* "sonarqube", "sonarcloud", or null (all) */
          var totalRepos = DATA.total_repos || 0,
            totalLoc = DATA.total_loc || 0,
            totalPrivateRepos = DATA.private_repos || 0,
            totalPublicRepos = DATA.public_repos || 0
          var statsHtml = '<h2>Sonar Stats</h2>'
          var isSonarQube = platformFilter === 'sonarqube',
            isSonarCloud = platformFilter === 'sonarcloud'

          /* SonarQube cards — shown when platform is sonarqube, OR all-platforms AND SonarQube has data */
          var sonarQubeRepoCount = sonarQube.total_repos || portfolio.sonarqube_count || 0
          var sonarCloudRepoCount = sonarCloud.total_repos || portfolio.sonarcloud_count || 0
          if (isSonarQube || (!isSonarCloud && sonarQubeRepoCount > 0)) {
            var sqRepos = resolvePlatformStat(
              sonarQube.total_repos,
              isSonarQube,
              totalRepos,
              portfolio.sonarqube_count
            )
            var sqLoc = resolvePlatformStat(
              sonarQube.total_loc,
              isSonarQube,
              totalLoc,
              portfolio.sonarqube_loc
            )
            var sqPrivate = resolvePlatformStat(
              sonarQube.private_repos,
              isSonarQube,
              totalPrivateRepos,
              0
            )
            var sqPublic = resolvePlatformStat(
              sonarQube.public_repos,
              isSonarQube,
              totalPublicRepos,
              0
            )
            statsHtml += buildPlatformStatsBlock(
              'SonarQube',
              'blue',
              ['Total Repos', 'Total LOC', 'Private Repos', 'Public Repos'],
              sqRepos,
              sqLoc,
              sqPrivate,
              sqPublic
            )
          }

          /* SonarCloud cards — shown when platform is sonarcloud, OR all-platforms AND SonarCloud has data */
          if (isSonarCloud || (!isSonarQube && sonarCloudRepoCount > 0)) {
            var scRepos = resolvePlatformStat(
              sonarCloud.total_repos,
              isSonarCloud,
              totalRepos,
              portfolio.sonarcloud_count
            )
            var scLoc = resolvePlatformStat(
              sonarCloud.total_loc,
              isSonarCloud,
              totalLoc,
              portfolio.sonarcloud_loc
            )
            var scPrivate = resolvePlatformStat(
              sonarCloud.private_repos,
              isSonarCloud,
              totalPrivateRepos,
              0
            )
            var scPublic = resolvePlatformStat(
              sonarCloud.public_repos,
              isSonarCloud,
              totalPublicRepos,
              0
            )
            statsHtml += buildPlatformStatsBlock(
              'SonarCloud',
              'green',
              ['Repos', 'LOC', 'Private', 'Public'],
              scRepos,
              scLoc,
              scPrivate,
              scPublic
            )
          }

          return statsHtml
        }

        /* risk colour + label helpers for the cost-intelligence org cards */
        function riskColorForCapacity(risk) {
          risk = (risk || '').toLowerCase()
          if (risk === 'high') return '#d4351c'
          if (risk === 'medium') return '#f47738'
          return '#00703c'
        }
        function capitalise(str) {
          return str ? str.charAt(0).toUpperCase() + str.slice(1) : ''
        }

        function buildPublicLocSectionHtml(org, publicSharePct) {
          if (org.public_loc <= 0) return ''
          return (
            '<div style="margin-bottom:14px">' +
            '<div style="font-size:20px;color:#0b0c0c;margin-bottom:6px"><strong>' +
            commas(org.public_loc) +
            '</strong> public lines <span style="font-size:16px;color:#505a5f;font-weight:normal">(not billed)</span></div>' +
            '<div style="background:#f3f2f1;border-radius:10px;height:14px;overflow:hidden;margin-bottom:4px" title="' +
            commas(org.public_loc) +
            ' public lines \u2014 not billed by SonarCloud">' +
            '<div style="width:' +
            publicSharePct +
            '%;height:100%;background:#1d70b8"></div>' +
            '</div>' +
            '<div style="font-size:16px;color:#505a5f">' +
            publicSharePct +
            '% of total LOC \u00b7 not counted against licence</div>' +
            '</div>'
          )
        }

        function buildReclaimSectionHtml(org, reclaimDrivers) {
          if (org.reclaimable_billable_loc <= 0) return ''
          var projectCount = (org.inactive_projects || 0) + (org.high_duplication_projects || 0)
          var projectSuffix = projectCount !== 1 ? 's' : ''
          var driversHtml = reclaimDrivers.length
            ? '<div style="font-size:17px;color:#505a5f;margin-top:4px">by cleaning up ' +
              reclaimDrivers.join(' and ') +
              ' project' +
              projectSuffix +
              '</div>'
            : ''
          return (
            '<div style="border-top:1px solid #f3f2f1;padding-top:12px;font-size:20px;color:#0b0c0c">' +
            '<span style="color:#00703c;font-weight:700">Potential LOC reduction (private repos):</span> up to ' +
            commas(org.reclaimable_billable_loc) +
            ' private lines' +
            driversHtml +
            '</div>'
          )
        }

        function buildCoverageWarningSectionHtml(org) {
          if (org.no_coverage_projects <= 0 || org.no_coverage_billable_loc <= 0) return ''
          return (
            '<div style="margin-top:12px;font-size:17px;color:#505a5f"><span style="color:#f47738;font-weight:700">Review:</span> ' +
            commas(org.no_coverage_projects) +
            ' project' +
            (org.no_coverage_projects !== 1 ? 's' : '') +
            ' (' +
            commas(org.no_coverage_billable_loc) +
            ' lines) have no test coverage \u2014 check test code is not being counted as source.</div>'
          )
        }

        function buildOrgCardHtml(orgName, org) {
          var utilisationPct = org.utilisation_pct || 0
          var riskColorHex = riskColorForCapacity(org.capacity_risk)
          var utilisationBarWidth = Math.max(0, Math.min(utilisationPct, 100))
          var orgTotalLoc = (org.private_loc || 0) + (org.public_loc || 0)
          var publicSharePct =
            orgTotalLoc > 0 ? Math.round(((org.public_loc || 0) / orgTotalLoc) * 100) : 0
          var reclaimDrivers = []
          if (org.inactive_projects > 0) reclaimDrivers.push(org.inactive_projects + ' inactive')
          if (org.high_duplication_projects > 0)
            reclaimDrivers.push(org.high_duplication_projects + ' highly duplicated')
          return (
            '<div style="flex:1 1 360px;min-width:320px;border:1px solid #c9dff1;border-radius:18px;padding:20px 22px;background:linear-gradient(180deg,#f8fbff 0%,#f2f8fd 100%);box-shadow:0 1px 2px rgba(11,12,12,.06)">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px">' +
            '<span style="font-size:24px;font-weight:700;color:#0b0c0c">' +
            esc(orgName) +
            '</span>' +
            '<span style="font-size:16px;font-weight:700;color:#fff;background:' +
            riskColorHex +
            ';padding:3px 12px;border-radius:12px;white-space:nowrap">' +
            capitalise(org.capacity_risk) +
            ' risk</span>' +
            '</div>' +
            '<div style="font-size:17px;color:#505a5f;margin-bottom:14px">' +
            esc(org.plan) +
            (org.billing_frequency ? ' \u00b7 ' + esc(org.billing_frequency) + ' billing' : '') +
            '</div>' +
            '<div style="font-size:20px;color:#0b0c0c;margin-bottom:6px"><strong>' +
            commas(org.billed_loc) +
            '</strong> of <strong>' +
            commas(org.loc_capacity) +
            '</strong> private lines used</div>' +
            '<div style="background:#f3f2f1;border-radius:10px;height:18px;overflow:hidden;margin-bottom:6px" title="' +
            utilisationPct +
            '% of licence used">' +
            '<div style="width:' +
            utilisationBarWidth +
            '%;height:100%;background:' +
            riskColorHex +
            '"></div>' +
            '</div>' +

        /* Accepted "not computed" phrases (0 new lines) — shown as a neutral success message rather than a config-issue flag */
        var COV_DUP_ACCEPTED_TEXT = [
          'not computed on 0 new lines to cover.',

          '0 lines cover',
          'there are not enough lines to compute coverage'
        ]

        function formatNumericCoverageValue(n, threshold, flagAbove) {
          var rounded = n.toFixed(2)
          if (threshold != null) {
            var breach = flagAbove ? n > threshold : n < threshold
            if (breach) return '<span style="color:#d4351c;font-weight:700">' + rounded + '%</span>'
          }
          return rounded + '%'
        }

        /* Returns a status html string for known "not computed" text values, or null when textVal isn't recognised */
        function formatTextualCoverageStatus(textVal) {
          var t = String(textVal || '')
            .trim()
            .toLowerCase()
          if (COV_DUP_ACCEPTED_TEXT.includes(t))
            return (
              '<span style="color:#00703c;font-weight:700" title="' +
              esc(String(textVal || '')) +
              '">Not computed (0 lines)</span>'
            )
          if (t === 'not computed' || t.startsWith('not computed'))
            return (
              '<span style="color:#f47738;font-weight:700" title="' +
              esc(String(textVal || '')) +
              '">' +
              String(textVal || 'Not Computed') +
              '</span>'
            )
          return null
        }

        function renderCoverageOrDuplicationValue(
          v,
          textVal,
          label,
          threshold,
          flagAbove,
          missingFields
        ) {
          if (!isBlank(v)) {
            var n = Number.parseFloat(v)
            if (!Number.isNaN(n)) return formatNumericCoverageValue(n, threshold, flagAbove)
          }
          var textStatusHtml = formatTextualCoverageStatus(textVal)
          if (textStatusHtml != null) return textStatusHtml
          if (label) missingFields.push(label)
          return (
            '<span style="background:#d4351c;color:#fff;padding:2px 8px;border-radius:4px;font-weight:700;font-size:18px" title="' +
            esc(String(textVal || 'Not available in Sonar \u2014 check project configuration')) +
            '">Config issue</span>'

        function initDraggableModalHeader(wrap) {
          var hdr = document.querySelector('.np-header')
          if (!hdr || hdr._d) return
          hdr._d = true
          var drag = false,
            sx,
            sy,
            ox,
            oy,
            el = wrap
          hdr.addEventListener('mousedown', function (e) {
            drag = true
            sx = e.clientX
            sy = e.clientY
            var r = el.getBoundingClientRect()
            ox = r.left
            oy = r.top
            el.style.transform = 'none'
            el.style.left = ox + 'px'
            el.style.top = oy + 'px'
            document.body.style.userSelect = 'none'
          })
          document.addEventListener('mousemove', function (e) {
            if (!drag) return
            el.style.left = ox + (e.clientX - sx) + 'px'
            el.style.top = oy + (e.clientY - sy) + 'px'
          })
          document.addEventListener('mouseup', function () {
            if (drag) {
              drag = false
              document.body.style.userSelect = ''
            }
          })
        }

        function resolveQualityGateState(qgSt) {
          var upper = qgSt ? String(qgSt).toUpperCase() : ''
          var passed = upper === 'OK' || upper === 'PASSED'
          var failed = upper === 'ERROR' || upper === 'FAILED'
          var cls = 'unknown'

          else if (failed) cls = 'fail'
          return { class: cls, passed: passed, failed: failed }

          '1.5\u20133 Years',
          '3\u20135 Years',
          '5\u20137 Years',
          '7+ Years'
        ]

        /* Parse band format: "0–6 Months=28;6–12 Months=27;..." */
        function parseBandCounts(v) {
          var o = {}
          if (!v || v === 0 || String(v).trim() === '' || String(v).trim() === '0') return o
          String(v)
            .split(';')
            .forEach(function (s) {
              s = s.trim()
              if (!s) return
              var eq = s.indexOf('=')
              if (eq === -1) return
              var band = s.slice(0, eq).trim(),
                cnt = Number.parseInt(s.slice(eq + 1), 10) || 0
              if (band) o[band] = cnt
            })
          return o
        }

        /* Map parsed bands to the fixed band array (zero-fill missing) */
        function toFixedBandArray(v) {
          var m = parseBandCounts(v)
          return FIXED_BANDS.map(function (b) {

            if (INDEX[k]) return INDEX[k]

            // fallback: contains match across all ids
            for (const p of AGING || []) {
              if (
                ids(p).some(function (id) {
                  return id.includes(k)

              )
                return p
            }
            return null
