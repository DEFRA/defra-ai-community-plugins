              s +=
                '<strong style="font-size:20px;color:#d4351c">&#9888; ' +
                uniqueMissing.length +
                ' metric' +
                (uniqueMissing.length > 1 ? 's' : '') +
                ' missing due to Sonar configuration</strong>'
              s +=
                '<p style="margin:6px 0 0;font-size:17px;color:#505a5f">Values shown as <span style="background:#d4351c;color:#fff;padding:1px 6px;border-radius:4px;font-weight:700;font-size:15px">Missing</span> or <span style="background:#d4351c;color:#fff;padding:1px 6px;border-radius:4px;font-weight:700;font-size:15px">Config issue</span> are not populated because they are not available in Sonar. This may be caused by a missing scanner configuration, incomplete analysis run, or unsupported language plugin. Check the project settings in SonarQube/SonarCloud.</p>'
              s += '</div>'
            }

            $('pcStructured').innerHTML = s

            modal.classList.add('visible')
            document.body.style.overflow = 'hidden'
            var wrap = document.querySelector('.np-wrap')
            wrap.style.left = '50%'
            wrap.style.top = '1vh'
            wrap.style.transform = 'translateX(-50%)'

            /* draggable header */
            initDraggableModalHeader(wrap)

            try {
              if (agChart) {
                agChart.destroy()
                agChart = null
              }
              var cv = $('pcAgingCanvas'),
                cp = cv.parentNode
              cv.remove()
              var nc = document.createElement('canvas')
              nc.id = 'pcAgingCanvas'
              cp.appendChild(nc)
              var agd = buildAgingData(p)
              requestAnimationFrame(function () {
                var rawMax = agd.maxVal > 0 ? agd.maxVal : 5
                var yMax = Math.ceil(rawMax * 1.2)
                agChart = new Chart(nc.getContext('2d'), {
                  type: 'bar',
                  data: {
                    labels: agd.labels,
                    datasets: [
                      {
                        label: 'Bugs',
                        data: agd.bug,
                        backgroundColor: '#E24B4A',
                        borderWidth: 0,
                        borderRadius: 3,
                        minBarLength: 3
                      },
                      {
                        label: 'Code Smells',
                        data: agd.smell,
                        backgroundColor: '#EF9F27',
                        borderWidth: 0,
                        borderRadius: 3,
                        minBarLength: 3
                      },
                      {
                        label: 'Vulnerabilities',
                        data: agd.vuln,
                        backgroundColor: '#87CEEB',
                        borderWidth: 0,
                        borderRadius: 3,
                        minBarLength: 3
                      }
                    ]
                  },
                  plugins: [createBarLabelPlugin()],
                  options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false }, tooltip: { enabled: false } },
                    scales: {
                      x: {
                        grid: { display: false },
                        ticks: {
                          maxRotation: 40,
                          font: { size: 12, weight: 'bold' },
                          color: '#000'
                        }
                      },
                      y: {
                        beginAtZero: true,
                        suggestedMax: yMax,
                        ticks: {
                          precision: 0,
                          stepSize: Math.max(1, Math.ceil(rawMax / 5)),
                          font: { size: 12, weight: 'bold' },
                          color: '#000'
                        }
                      }
                    }
                  }
                })
              })
            } catch (e) {
              console.error('Chart error:', e)
            }
          }

          function closeM() {
            modal.classList.remove('visible')
            document.body.style.overflow = ''
          }
          globalThis.__showProjectDetails = showP
        }
      })()

      /* ---- Navigation between views ---- */
      /* Home breadcrumb + header link -> go back to home view */
      function goHome() {
        if (globalThis.__closeGroupView) globalThis.__closeGroupView()
      }

      function initNavigation() {
        // Group search is always visible on home page, no toggle needed
        var groupSearch = document.getElementById('groupSearch')
        if (groupSearch) groupSearch.disabled = false

        document.getElementById('breadcrumbHome').addEventListener('click', goHome)
        document.getElementById('headerHomeLink').addEventListener('click', function (e) {
          e.preventDefault()
          goHome()
        })
      }
    </script>
    <!-- Group Modal (no longer govuk-headerused - kept hidden for compatibility) -->
    <div id="groupModal" style="display: none"></div>
  </body>
</html>
